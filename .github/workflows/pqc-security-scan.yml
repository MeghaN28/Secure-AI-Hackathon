name: PQC Security Scan


on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - "*"


permissions:
  contents: read
  pull-requests: write
  issues: write


jobs:
  pqc-scan:

    runs-on: ubuntu-latest


    defaults:
      run:
        working-directory: ./ai-security-copilot


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install --no-cache-dir -r requirements.txt

          pip uninstall -y mistralai || true

          pip install --no-cache-dir mistralai==1.0.2


      - name: Verify Mistral SDK
        run: |
          pip show mistralai

          python3 -c "from mistralai import Mistral; print('Mistral SDK loaded successfully!')"


      - name: Run CBOM Security Analysis
        run: |
          python3 cbom_parser.py


      - name: Run PQC Rule Engine
        run: |
          python3 rule_engine.py


      - name: Generate Remediation Plan
        run: |
          python3 remediation_engine.py


      - name: Generate AI Security Report
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"

        run: |
          python3 agent.py


      - name: Security Score Gate
        run: |
          python3 security_gate.py


      - name: Upload Security Report Artifact
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: quantum-security-report
          path: output/quantum_security_report.md


      - name: Comment Security Report on PR
        if: github.event_name == 'pull_request'

        uses: actions/github-script@v7

        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const fs = require('fs');


            const reportPath =
              'output/quantum_security_report.md';


            if (!fs.existsSync(reportPath)) {

              core.setFailed(
                "Security report was not generated."
              );

              return;

            }


            const report = fs.readFileSync(
              reportPath,
              'utf8'
            );


            await github.rest.issues.createComment({

              owner: context.repo.owner,

              repo: context.repo.repo,

              issue_number: context.issue.number,

              body:
                "## 🔐 PQC Security Assessment Report\n\n" + report

            });