name: PQC Security Scan


on:
  pull_request:
    branches:
      - main

  # Only push, not pull_request, is scoped this way on purpose: a push to a
  # branch that also has an open PR was triggering two independent runs for
  # the same commit (pull_request + push), each making its own separate LLM
  # call - so the PR comment and the console log of "the same commit" could
  # legitimately show different guardrail results (non-deterministic LLM
  # output), which is confusing and doubles LLM spend for no benefit.
  # Direct pushes to main (e.g. a merge) still get scanned; feature-branch
  # work is covered by the pull_request trigger.
  push:
    branches:
      - main


permissions:
  contents: read
  pull-requests: write
  issues: write


jobs:

  pqc-scan:

    runs-on: ubuntu-latest


    defaults:
      run:
        working-directory: ./ai-security-copilot


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"



      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-model-cache-v1
          restore-keys: |
            huggingface-model-cache-



      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install --no-cache-dir -r requirements.txt

          pip uninstall -y mistralai || true

          pip install --no-cache-dir mistralai==1.0.2




      - name: Verify Mistral SDK
        run: |

          python3 -c "
          from mistralai import Mistral
          print('Mistral SDK loaded successfully!')
          "




      # ==============================
      # CBOM ANALYSIS
      # ==============================
      # cbom_parser.py is the single analyzer in the pipeline and the only
      # step that writes output/security_findings.json.

      - name: Run CBOM Security Analysis
        run: |

          python3 cbom_parser.py



      # rule_engine.py no longer re-analyzes the CBOM (it used to, and
      # competed with cbom_parser.py to write the same output file). It now
      # validates that output/security_findings.json is well-formed and
      # still consistent with pqc_rules.json, and fails the job if not -
      # so a bad or stale findings file is caught here instead of silently
      # flowing into remediation planning and the AI report.
      - name: Validate PQC Findings Against Rule Book
        run: |

          python3 rule_engine.py




      # ==============================
      # SONARQUBE ANALYSIS
      # ==============================

      - name: Parse SonarQube Findings
        run: |

          python3 sonarqube_parser.py




      - name: Combine CBOM and Sonar Context
        run: |

          python3 sonar_integration.py




      # ==============================
      # REMEDIATION PLANNING
      # ==============================

      - name: Generate Remediation Plan
        run: |

          python3 remediation_engine.py




      # ==============================
      # RAG KNOWLEDGE BASE
      # ==============================

      - name: Ingest NIST Knowledge Base
        env:
          HF_HOME: ~/.cache/huggingface
          TRANSFORMERS_CACHE: ~/.cache/huggingface
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: |
          python3 ingest_documents.py


      # ==============================
      # AI SECURITY AGENT + GUARDRAILS
      # ==============================

      - name: Generate AI Security Report (with Guardrails)

        env:

          # Which LLM backend generates the report. Defaults to "mistral" if
          # unset; set the LLM_PROVIDER repo/environment variable to
          # "anthropic" to use Claude instead - no code changes required
          # (see ai-security-copilot/llm_client.py).
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'mistral' }}

          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # Guardrail violations at or above this severity fail this step
          # (and therefore the job). See ai-security-copilot/config.py.
          GUARDRAIL_BLOCK_SEVERITY: ${{ vars.GUARDRAIL_BLOCK_SEVERITY || 'high' }}

          HF_HOME: ~/.cache/huggingface

          TRANSFORMERS_CACHE: ~/.cache/huggingface

          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"


        run: |

          python3 agent.py




      # ==============================
      # SECURITY GATE
      # ==============================
      # This is the actual merge gate: fails the job (blocking the PR, if
      # this check is marked required in branch protection) when the
      # readiness score is below threshold OR the guardrails reported a
      # blocking violation. `if: always()` so it still runs - and still
      # reports failure - even if agent.py above already exited non-zero
      # due to a guardrail violation.
      - name: Enforce Security Gate

        if: always()

        env:

          MINIMUM_SECURITY_SCORE: ${{ vars.MINIMUM_SECURITY_SCORE || '60' }}

        run: |

          python3 security_gate.py




      # ==============================
      # STORE REPORT
      # ==============================

      - name: Upload Security Report Artifact

        if: always()

        uses: actions/upload-artifact@v4


        with:

          name: quantum-security-report

          path: |
            ai-security-copilot/output/quantum_security_report.md
            ai-security-copilot/output/guardrail_results.json





      # ==============================
      # PR COMMENT
      # ==============================

      - name: Comment Security Report on PR

        # always() so the PR still gets the report/guardrail comment even
        # when an earlier step (agent.py or the security gate) failed the
        # job - a red X with no explanation isn't actionable.
        if: always() && github.event_name == 'pull_request'

        uses: actions/github-script@v7


        with:

          github-token: ${{ secrets.GITHUB_TOKEN }}


          script: |

            const fs = require('fs');


            const reportPath =
              'ai-security-copilot/output/quantum_security_report.md';

            const guardrailPath =
              'ai-security-copilot/output/guardrail_results.json';


            if (!fs.existsSync(reportPath)) {

              core.warning(
                "Security report was not generated."
              );

              return;

            }


            const report = fs.readFileSync(
              reportPath,
              'utf8'
            );


            // Build guardrail summary
            let guardrailSection = '';

            if (fs.existsSync(guardrailPath)) {

              const guardrails = JSON.parse(
                fs.readFileSync(guardrailPath, 'utf8')
              );

              const pre = guardrails.pre_generation;
              const post = guardrails.post_generation;

              const injectionStatus = pre.passed
                ? '✅ Passed' : `⚠️ ${pre.threat_count} threat(s) detected`;

              const hallucinationStatus = post.hallucination_check.passed
                ? '✅ Passed' : `⚠️ ${post.hallucination_check.violation_count} violation(s)`;

              const outputStatus = post.output_validation.passed
                ? '✅ Passed' : `⚠️ ${post.output_validation.violation_count} issue(s)`;

              const completeness = post.output_validation.completeness_score;

              guardrailSection = `

            ---

            ## 🛡️ AI Guardrail Validation

            | Guardrail | Status |
            |-----------|--------|
            | Prompt Injection Protection | ${injectionStatus} |
            | Hallucination Detection | ${hallucinationStatus} |
            | Output Validation | ${outputStatus} |

            **Report Completeness:** ${completeness}%

            `;

              // Add violation details if any failed
              if (!post.hallucination_check.passed) {
                guardrailSection += '\n<details><summary>Hallucination Details</summary>\n\n';
                for (const v of post.hallucination_check.violations) {
                  guardrailSection += `- **[${v.severity.toUpperCase()}]** ${v.detail}\n`;
                }
                guardrailSection += '\n</details>\n';
              }

              if (!post.output_validation.passed) {
                guardrailSection += '\n<details><summary>Output Validation Details</summary>\n\n';
                for (const v of post.output_validation.violations) {
                  guardrailSection += `- **[${v.severity.toUpperCase()}]** ${v.detail}\n`;
                }
                guardrailSection += '\n</details>\n';
              }

            }


            await github.rest.issues.createComment({

              owner: context.repo.owner,

              repo: context.repo.repo,

              issue_number: context.issue.number,

              body:
                "## 🔐 PQC Security Assessment Report\n\n" +
                report +
                guardrailSection

            });
